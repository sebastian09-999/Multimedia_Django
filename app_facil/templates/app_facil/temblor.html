<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Sismos</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #f9f9f9; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 30px 20px;
            box-sizing: border-box;
            gap: 25px;
        }
        .contenedor { 
            background-color: white; 
            padding: 30px 40px; 
            border-radius: 10px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 600px; 
            text-align: center; 
            box-sizing: border-box;
        }
        h2 {
            margin-top: 0;
            color: #333;
        }
        .formulario-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            text-align: left;
            margin-bottom: 20px;
            margin-top: 15px;
        }
        .campo {
            display: flex;
            flex-direction: column;
        }
        .campo.ancho-completo {
            grid-column: span 2;
        }
        label {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 0.9em;
            color: #555;
        }
        input, select { 
            padding: 10px; 
            font-size: 1em; 
            border: 1px solid #ccc; 
            border-radius: 5px; 
            width: 100%; 
            box-sizing: border-box;
            background-color: white;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #0056b3;
        }
        button, .btn-enlace { 
            padding: 12px 30px; 
            font-size: 1.1em; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer; 
            width: 100%;
            box-sizing: border-box;
            text-decoration: none; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: white;
            transition: background-color 0.3s;
        }
        .botones-container {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
        .btn-primario {
            background-color: #0056b3;
        }
        .btn-primario:hover {
            background-color: #004494;
        }
        .btn-secundario {
            background-color: #28a745;
        }
        .btn-secundario:hover {
            background-color: #218838;
        }
        .btn-busqueda {
            background-color: #ffc107; 
            color: black; 
            font-weight: bold;
        }
        .btn-busqueda:hover {
            background-color: #e0a800;
        }
    </style>
</head>
<body>

    <!-- TARJETA 1: REGISTRO DE SISMO -->
    <div class="contenedor">
        <h2>Registro de Sismo</h2>
        
        <form action="{% url 'salida_temblor' %}" method="POST">
            {% csrf_token %}
            <div class="formulario-grid">
                
                <!-- Magnitud -->
                <div class="campo">
                    <label for="magnitud">Magnitud:</label>
                    <input type="number" step="0.1" id="magnitud" name="magnitud" placeholder="Ej: 5.4" required>
                </div>

                <!-- Profundidad -->
                <div class="campo">
                    <label for="profundidad">Profundidad (km):</label>
                    <input type="number" step="0.1" id="profundidad" name="profundidad" placeholder="Ej: 30.5" required>
                </div>

                <!-- Fecha -->
                <div class="campo">
                    <label for="fecha">Fecha:</label>
                    <input type="date" id="fecha" name="fecha" required>
                </div>

                <!-- Hora -->
                <div class="campo">
                    <label for="hora">Hora:</label>
                    <input type="time" id="hora" name="hora" required>
                </div>

                <!-- Rango -->
                <div class="campo">
                    <label for="rango">Rango (km):</label>
                    <input type="number" step="0.1" id="rango" name="rango" placeholder="Ej: 15" required>
                </div>

                <!-- Área -->
                <div class="campo">
                    <label for="area">Área afectada:</label>
                    <input type="text" id="area" name="area" placeholder="Ej: Zona Norte" required>
                </div>

                <!-- Lugar -->
                <div class="campo ancho-completo">
                    <label for="lugar">Lugar / Epicentro:</label>
                    <input type="text" id="lugar" name="lugar" placeholder="Ej: Los Santos, Santander" required>
                </div>

            </div>
            
            <div class="botones-container">
                <!-- Botón 1: Guarda y muestra solo este registro -->
                <button type="submit" name="accion" value="ver_unico" class="btn-primario">
                    Registrar y ver detalle
                </button>
                
                <!-- Botón 2: Ver lista completa -->
                <a href="{% url 'salida_temblor' %}" class="btn-secundario btn-enlace">
                    Ver todos los registros
                </a>
            </div>
        </form>
    </div>

    <!-- TARJETA 2: FILTRAR / BUSCAR SISMO -->
    <div class="contenedor">
        <h2>Filtrar / Buscar Sismo</h2>
        
        <form action="{% url 'buscar_sismos' %}" method="GET">
            <div style="display: flex; flex-direction: column; gap: 15px; text-align: left; margin-bottom: 20px;">
                
                <!-- Lista desplegable para seleccionar el criterio -->
                <div class="campo">
                    <label for="criterio">Filtrar por:</label>
                    <select id="criterio" name="criterio" required>
                        <option value="" disabled selected>-- Selecciona un campo --</option>
                        <option value="lugar">Lugar / Epicentro</option>
                        <option value="area">Área afectada</option>
                        <option value="magnitud">Magnitud</option>
                        <option value="profundidad">Profundidad</option>
                        <option value="fecha">Fecha (YYYY-MM-DD)</option>
                        <option value="hora">Hora (HH:MM)</option>
                        <option value="rango">Rango</option>
                    </select>
                </div>

                <!-- Campo de texto para escribir el valor que buscas -->
                <div class="campo">
                    <label for="valor">Valor a buscar:</label>
                    <input type="text" id="valor" name="valor" placeholder="Ej: Popayán, 5.4, 2026-08-31..." required>
                </div>

            </div>
            
            <button type="submit" class="btn-busqueda">
                🔍 Buscar Sismo
            </button>
        </form>
    </div>

</body>
</html>
