<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido a Popayán</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .tarjeta {
            background-color: #ffffff;
            padding: 40px 60px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            text-align: center; 
            border-top: 5px solid #0056b3;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 8px;
            font-size: 2.5em;
        }
        p {
            color: #666;
            font-size: 1.2em;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="tarjeta">
        <h1>¡Bienvenido a Popayán!</h1>
        <p>La Ciudad Blanca de Colombia</p>
    </div>

</body>
</html>
